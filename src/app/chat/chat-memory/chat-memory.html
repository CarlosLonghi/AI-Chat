<div class="chat-page">
  <aside class="chat-list">
    <button matButton="filled" class="new-chat" routerLink="/chat-memory">
      <mat-icon>add</mat-icon>
      New chat
    </button>

    <mat-nav-list>
      @for (chat of chats(); track chat.id) {
        <div class="chat-item">
          <a mat-list-item
            class="chat-link"
            [routerLink]="['/chat-memory', chat.id]"
            routerLinkActive
            #rla="routerLinkActive"
            [activated]="rla.isActive">
            <span matListItemTitle>{{ chat.description }}</span>
          </a>
          <button matIconButton
            [matMenuTriggerFor]="chatMenu"
            [attr.aria-label]="'Options for ' + chat.description">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #chatMenu="matMenu">
            <button mat-menu-item (click)="renameChat(chat)">
              <mat-icon>edit</mat-icon>
              <span>Rename</span>
            </button>
            <button mat-menu-item (click)="deleteChat(chat)">
              <mat-icon>delete</mat-icon>
              <span>Delete</span>
            </button>
          </mat-menu>
        </div>
      }
    </mat-nav-list>
  </aside>

  <app-chat-window
    class="chat-window"
    [title]="title()"
    [messages]="messages()"
    [isLoading]="isLoading()"
    (send)="sendMessage($event)"
  />
</div>
