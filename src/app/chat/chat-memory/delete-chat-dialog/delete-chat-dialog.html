<h2 mat-dialog-title>{{ 'dialogs.delete.title' | transloco }}</h2>
<mat-dialog-content>
  {{ 'dialogs.delete.body' | transloco: { title: title } }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close cdkFocusInitial>{{ 'dialogs.delete.cancel' | transloco }}</button>
  <button matButton="filled" class="danger" [mat-dialog-close]="true">{{ 'dialogs.delete.confirm' | transloco }}</button>
</mat-dialog-actions>
