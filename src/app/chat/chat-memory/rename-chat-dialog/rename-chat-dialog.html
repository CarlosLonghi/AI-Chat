<form [formGroup]="form" (ngSubmit)="save()">
  <h2 mat-dialog-title>Rename chat</h2>
  <mat-dialog-content>
    <label class="field-label" for="chat-title-input">Title</label>
    <input
      id="chat-title-input"
      class="field-input"
      cdkFocusInitial
      formControlName="title"
      [maxlength]="maxLength"
      [attr.aria-invalid]="title.invalid"
      aria-describedby="chat-title-help"
    />
    <div class="field-footer" id="chat-title-help">
      <span class="field-error" role="alert">
        @if (title.invalid && title.dirty) {
          Title is required
        }
      </span>
      <span class="field-hint">{{ title.value.length }} / {{ maxLength }}</span>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close>Cancel</button>
    <button matButton="filled" type="submit" [disabled]="title.invalid">Save</button>
  </mat-dialog-actions>
</form>
